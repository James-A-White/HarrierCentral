<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Never leak the URL (which may briefly carry the same-device login code)
       to third parties via the Referer header. -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hcportal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Harrier Central</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div class="horizontal div">
    <div class="vertical">
        <h1 style="color:rgb(249, 208, 193); font-family:verdana;">Loading</h1>
        <img class="spin-logo" src="https://harriercentral.blob.core.windows.net/harrier/hclogo250round.png"/>
        <h1 style="color:rgb(249, 208, 193); font-family:verdana;">Harrier Central</h1>
      </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
