name: harrier_central
description: A mobile app to manage your Hash House Harriers life.

environment:
  sdk: ">=1.19.0 <3.0.0"
  flutter: ^0.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^0.1.2
  http: ^0.12.0
  scoped_model: ^0.3.0
  auto_size_text: ^0.2.0
  geolocator: ^2.0.1
  crypto: ^2.0.6
  utf: ^0.9.0+5
  font_awesome_flutter: ^8.0.1
  cached_network_image: ^0.5.0
  shared_preferences: ^0.4.3
  flutter_facebook_login: ^1.1.1
  flutter_map: ^0.3.0
  flutter_staggered_grid_view: ^0.2.3
  url_launcher: ^4.0.1
  qr_flutter: ^1.1.5
  barcode_scan: ^0.0.7
  image_picker: ^0.4.10
  image_cropper: ^0.0.9
  permission_handler: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl_translation: ^0.17.1


  flutter_launcher_icons: ^0.6.1

flutter_icons:
  android: true 
  ios: 'HarrierCentralIcon'
  image_path: 'assets/icon/icon.png'
  # adaptive_icon_background: '#FFE02000'
  # adaptive_icon_foreground: 'assets/icon/hc_app_icon_adaptive_foot.png'

  # hc_app_icon_adaptive_foot

#flutter pub pub run flutter_launcher_icons:main


# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - images/generic_logos/
    - images/icons/
    - images/init/
    - images/other/
    - images/avatars/

  fonts:
    - family: AvenirNext
      fonts:
        - asset: fonts/AvenirNext-Bold.ttf
        - asset: fonts/AvenirNext-BoldItalic.ttf
        - asset: fonts/AvenirNext-Heavy.ttf
        - asset: fonts/AvenirNext-HeavyItalic.ttf
        - asset: fonts/AvenirNext-UltraLight.ttf
        - asset: fonts/AvenirNext-UltraLightItalic.ttf

    - family: AvenirNext
      fonts:
        - asset: fonts/AvenirNext-Regular.ttf
        - asset: fonts/AvenirNext-Italic.ttf
          style: italic
        
    - family: AvenirNextMedium
      fonts:
        - asset: fonts/AvenirNext-Medium.ttf
        - asset: fonts/AvenirNext-MediumItalic.ttf
          style: italic

    - family: AvenirNextCondensed
      fonts:
        - asset: fonts/AvenirNextCondensed-Heavy.ttf
        - asset: fonts/AvenirNextCondensed-HeavyItalic.ttf
        - asset: fonts/AvenirNextCondensed-Italic.ttf
        - asset: fonts/AvenirNextCondensed-Medium.ttf
        - asset: fonts/AvenirNextCondensed-MediumItalic.ttf
        - asset: fonts/AvenirNextCondensed-Regular.ttf
        - asset: fonts/AvenirNextCondensed-UltraLight.ttf
        - asset: fonts/AvenirNextCondensed-UltraLightItalic.ttf
    - family: AvenirNextCondensedDemiBold
      fonts:
        - asset: fonts/AvenirNextCondensedDemiBold.ttf
        - asset: fonts/AvenirNextCondensedDemiBoldItalic.ttf
          style: italic
    - family: AvenirNextDemiBold
      fonts:
        - asset: fonts/AvenirNextDemiBold.ttf
        - asset: fonts/AvenirNextDemiBoldItalic.ttf
          style: italic
    - family: AvenirNextCondensedBold
      fonts:
        - asset: fonts/AvenirNextCondensedBold.ttf
        - asset: fonts/AvenirNextCondensedBoldItalic.ttf
          style: italic
 

  # To add assets to your application, add an assets section, like this:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.io/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.io/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.io/custom-fonts/#from-packages
